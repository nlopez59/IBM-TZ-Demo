---
apiVersion: deploy.ibm.com/v1
kind: DeploymentMethod
metadata:
  name: "CICS-DB2-BATCH-v17a-IBM-Demo"
  version: "1.0.0"
  
  annotations:
    deployVersion: "1.0.0"

# A deployment method yaml defines the processes (building blocks) to deployed a DBB generated artifact package
# It is used to generate a deployment plan used with a targe zOS ,ENV yaml file to perform a deployment 
# See this links: 
#   https://www.ibm.com/docs/en/developer-for-zos/17.0.x?topic=files-deployment-method
# 
# Building blocks supported in this sample: 
#   https://www.ibm.com/docs/en/developer-for-zos/17.0.x?topic=blocks-package
#   https://www.ibm.com/docs/en/developer-for-zos/17.0.x?topic=blocks-member-copy
#   https://www.ibm.com/docs/en/developer-for-zos/17.0.x?topic=blocks-db2-bind-package
#   https://www.ibm.com/docs/en/developer-for-zos/17.0.x?topic=blocks-job-submit

activities:

  # ---------------------------------------------------------
  # Expand a package activity 
  # ---------------------------------------------------------
  - name: PACKAGE
    description: Expand the deployment package in USS

    tags:
      - always

    actions:
      - name: PACKAGE
        steps:
          - name: PACKAGE

  # ---------------------------------------------------------
  # Deploy modules activity (copy to PDS)
  # ---------------------------------------------------------
  - name: DEPLOY_MODULES
    description: Copy artifacts as members into a PDS dataset

    actions:
      - name: UPDATE
        states:
          - UNDEFINED
        steps:
          - name: MEMBER_COPY

    types:
      - name: DBRM      
      - name: LOAD
      - name: CICSLOAD
      - name: MAPLOAD
      - name: JCL

    is_artifact: true

  # ---------------------------------------------------------
  # DB2 bind package activity 
  # ---------------------------------------------------------
  - name: DB2
    description: Bind DB2 packages for DBRM artifacts

    actions:
      - name: UPDATE
        states:
          - UNDEFINED
        steps:
          - name: DB2_BIND_PACKAGE
            properties:
              - key: template
                value: db2_bind_package

    types:
      - name: DBRM

    is_artifact: true

  
  # ------------------------------------------------------------
  # job_submit activity for non-CMCI-based CICS NEWCOPY   
  # This activity uses Wazi Deploy query language to scan the generated plan 
  # and extract a list of artifact names in the cicsload variable passed to the newcopy.jcl.j2 jinja2 template. 
  # This building block also submit the rendered job using the options provided in the associated .ENV file 
  # ------------------------------------------------------------
  - name: NEWCOPY
    description: |
      This action gathers all CICS artifacts and passes a list to the  
      newcopy.jcl.j2 jinja2 template to generate newcopy Modify commands
    
    actions:
      - name: NEWCOPY      
        steps:
          - name: NEWCOPY
            is_artifact: True

            # Select CICS artifact types as passed to Wazi Deploy by DBB in the prepare phase's input DBB buildReport.json file
            types:
              - name: "CICSLOAD"
              - name: "MAPLOAD"

            # Wazi Deploy Query Lang wq-query function scans the current deploy plan for cics types to pull the artifact file name  as the cicsload arg 
            # used by the jinja2 template to generate newcopy modify jcl. 
            # Ref: https://www.ibm.com/docs/en/developer-for-zos/17.0.x?topic=reference-query-language-deployment-analysis  
            #      https://www.ibm.com/docs/en/developer-for-zos/17.0.x?topic=reference-syntax-conditional-deployment            
            loop:
              loop_query: wd_query[[ current_plan_step.artifacts[].name ]]
              loop_var: cicsload
              
            when:
              - wd_query[[ length ( current_plan_step.artifacts) ]] != 0

            # Defines the job_submit building block
            # And the .ENV file section 'newcopy_job' to perform this activity on the target zOS Host(lpar).
            properties:
              - key: template
                value: job_submit

              - key: var_job_submit
                value: newcopy_job 

  