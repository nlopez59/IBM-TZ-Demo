name: "zapp-sample"
version: "3.0.0"
author:
  name: "NelsonLopez"



propertyGroups:
  - name: cobol-copybooks
    language: cobol
    libraries:
      - name: syslib
        type: local
        locations:
          - "**/copybook"
      
      - name: syslib
        type: mvs
        locations:
          - "IBMUSER.VSCODE.COPY"          
   
profiles:
  
  - name: "dbb-userbuild"
    type: "dbb"
    settings:
      # On the first build, run "IBM user build full upload' to refresh the build conf files on zOS  
      command: "mkdir ~/zdevops; 
              cp -r conf ~/zdevops/;          
              export DBB_BUILD=~/zdevops/conf/build; 
              dbb  -DBB_DAEMON_PORT 8180  build "   
      
      lifecycle: user      
      lifecycleArgs:
        - "--hlq ${zopeneditor.userbuild.userSettings.dbbHlq}"
      
      # The files to upload to USS when IBM user build full upload' is selected 
      additionalDependencies:
        - "dbb-app.yaml"
        - "source/.dbb_processor/*"
        - "conf/*"
        

      logFilePatterns:
        - "**/logs/*.log"

 